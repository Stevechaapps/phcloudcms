name = "ph"
compatibility_date = "2026-07-14"
main = "src/index.ts"
workers_dev = true

# ── Static Assets ──────────────────────────────────────────────────
# Self-hosted fonts + favicon, served from the edge before the Worker
# runs (no origin round-trip, free tier). Everything else falls through
# to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# ── D1 Database ─────────────────────────────────────────────────────
# This file ships with the author's IDs so the live demo deploys from git.
# For your own deployment, replace BOTH ids below with yours:
# D1 id: Cloudflare Dashboard → Storage & Databases → D1 → your db → copy ID.
[[d1_databases]]
binding = "DB"
database_name = "phcloud-db"
database_id = "a2823457-ab83-40fd-8b29-0e5054caa728"

# ── KV Namespace ────────────────────────────────────────────────────
# KV id: Cloudflare Dashboard → Storage & Databases → KV → your namespace → copy ID.
[[kv_namespaces]]
binding = "CACHE"
id = "2d0d517b10eb4e66bdacfebd108e3898"

# ── Workers AI ─────────────────────────────────────────────────────
# Free tier: 10,000 neurons/day — no credit card, no API key.
[ai]
binding = "AI"

# ── Analytics Engine ───────────────────────────────────────────────
# Free tier: 100k data points/day. Disabled until you enable Analytics
# Engine for this account (dash.cloudflare.com → Workers → Analytics
# Engine → Enable). Stats work without it — D1 is the primary store;
# this is a best-effort mirror. Uncomment once enabled.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "phcloud_views"
