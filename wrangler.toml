name = "ph"
compatibility_date = "2026-07-14"
main = "src/index.ts"
workers_dev = true

# ── D1 Database ─────────────────────────────────────────────────────
# Replace <YOUR_D1_DATABASE_ID> with your actual D1 database ID.
# Get it from: Cloudflare Dashboard → D1 SQL database → click your db → copy the ID.
[[d1_databases]]
binding = "DB"
database_name = "phcloud-db"
database_id = "a2823457-ab83-40fd-8b29-0e5054caa728"

# ── KV Namespace ────────────────────────────────────────────────────
# Replace <YOUR_KV_NAMESPACE_ID> with your actual KV namespace ID.
# Get it from: Cloudflare Dashboard → Workers KV → click your namespace → copy the ID.
[[kv_namespaces]]
binding = "CACHE"
id = "2d0d517b10eb4e66bdacfebd108e3898"

# ── Workers AI ─────────────────────────────────────────────────────
# Free tier: 10,000 neurons/day — no credit card, no API key.
[ai]
binding = "AI"

# ── Analytics Engine ───────────────────────────────────────────────
# Free tier: 100k data points/day. Dataset auto-created on first write.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "phcloud_views"
